spring.application.name=delivery-api-test

# Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate for Tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Data initialization for tests
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Disable unnecessary features for tests
spring.devtools.restart.enabled=false
spring.h2.console.enabled=false

# Logging configuration for tests (reduced verbosity)
logging.level.root=WARN
logging.level.com.deliverytech=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.web=WARN

# JWT Configuration for Tests
jwt.secret=dGVzdFNlY3JldEtleTEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY=
jwt.expiration=3600000

# Disable Swagger in tests
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Test specific configurations
spring.jpa.properties.hibernate.generate_statistics=false